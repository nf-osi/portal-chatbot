name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - docs/**
  workflow_dispatch:  # manually trigger a rebuild/redeploy, e.g. after a docs-branch-only change

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site (docs branch)
        uses: actions/checkout@v4
        with:
          ref: docs

      - name: Checkout docs content (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-docs
          sparse-checkout: docs
          sparse-checkout-cone-mode: false

      - name: Copy content into place
        run: |
          rm -rf site/src/content/docs
          mkdir -p site/src/content/docs
          cp -r main-docs/docs/. site/src/content/docs/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
